<svg xmlns="http://www.w3.org/2000/svg" aria-label="Blue ice medical laboratory dashboard mockup" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="blueBackground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf2f8"/>
      <stop offset=".52" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#e4edf7"/>
    </linearGradient>
    <linearGradient id="blueGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".96"/>
      <stop offset="1" stop-color="#f6f9ff" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="headerGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#dce9f7" stop-opacity=".055"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b91ee"/>
      <stop offset="1" stop-color="#1768c4"/>
    </linearGradient>
    <radialGradient id="blueGlowA">
      <stop offset="0" stop-color="#75b6ff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#75b6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlowB">
      <stop offset="0" stop-color="#98bff4" stop-opacity=".19"/>
      <stop offset="1" stop-color="#98bff4" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#17324e" flood-opacity=".28"/>
    </filter>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
      .body { font-size: 13px; }
      .muted { fill: #687b91; }
      .bright { fill: #1d3148; }
      #blueSidebar .bright { fill: #eff6ff; }
      #blueSidebar .muted { fill: #b7c9df; }
      .card { fill: url(#blueGlass); stroke: #bed0e5; stroke-opacity: .65; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#blueBackground)"/>
